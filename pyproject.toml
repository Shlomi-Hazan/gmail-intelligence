[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-intelligence"
dynamic = ["version"]
description = "Local-first, AI-assisted Gmail management (early development; no Gmail integration yet)"
readme = "README.md"
requires-python = ">=3.10"
# All free and open source. Official Google libraries for OAuth/Gmail; keyring for the macOS Keychain.
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "keyring>=25",
]

[project.scripts]
gmail-intelligence = "gmail_intelligence.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gmail_intelligence.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gmail_intelligence = ["dashboard/static/*", "dashboard/static/*/*", "dashboard/static/*/*/*"]
